<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Wide rectangle representing aspect ratio constraint -->
  <rect x="1.5" y="4" width="13" height="8" rx="0.5"
        style="fill:none;stroke:#bebebe;stroke-width:1.2"/>
  <!-- Diagonal line representing the ratio -->
  <line x1="1.5" y1="12" x2="14.5" y2="4" style="stroke:#bebebe;stroke-width:0.8;stroke-dasharray:1.5,1"/>
  <!-- Small chain/link marks at corners to suggest locked ratio -->
  <circle cx="4" cy="6" r="1" style="fill:#bebebe"/>
  <circle cx="12" cy="10" r="1" style="fill:#bebebe"/>
</svg>
